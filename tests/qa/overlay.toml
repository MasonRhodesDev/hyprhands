# What the owner sees while hyprhands drives: the hazard-tape frame, the robot cursor,
# the jump trail, the click ring, captions, the capture blink, the stopped state, and the cleanup
# when the session dies.
#
# Run with hypr-qa (https://github.com/MasonRhodesDev/hypr-qa) on the KVM host, from a hyprhands
# checkout built in release:  hypr-qa run tests/qa/overlay.toml
#
# The guest's active border is pinned to the owner's #a4c9fe, so the overlay's colour (its
# complement, src/overlay.rs Palette) is a known #ff9a0a; stopped is #ff3b4a. The frame is 12 px:
# 2 px dark rim, an 8 px band of marching two-tone stripes, 2 px dark rim. No tint by default
# (tests/qa/tint.toml covers serve --tint). The guest is plain-hyprland: Virtual-1, 1280x800,
# scale 1, cursor size 24, one monitor (the tint on the seat's other monitors is not covered here).

name     = "hyprhands-overlay"
profile  = "plain-hyprland"
snapshot = "session-ready"

[guest]
hyprland = { general = { col = { active_border = "rgb(a4c9fe)" } } }

[[setup]]
push = { src = "../../target/release/hyprhands", dst = "/usr/local/bin/hyprhands", mode = "0755" }

[[setup]]
session = "hyprhands --help >/dev/null 2>&1; hyprhands doctor"

[hyprhands]
argv = ["hyprhands", "serve", "--monitor", "Virtual-1"]

# The session is up: the striped band on all four edges, in the theme's complement.
[[step]]
id = "frame-up"
do = { wait_ms = 400 }

  [[step.expect]]
  at = "+0ms..+300ms"
  check = "pixel"
  region = [0, 2, 0, 8]
  color = "#ff9a0a"
  tolerance = 48
  min_fraction = 0.3

  [[step.expect]]
  at = "+0ms..+300ms"
  check = "pixel"
  region = [0, -10, 0, 8]
  color = "#ff9a0a"
  tolerance = 48
  min_fraction = 0.3

  [[step.expect]]
  at = "+0ms..+300ms"
  check = "pixel"
  region = [2, 0, 8, 0]
  color = "#ff9a0a"
  tolerance = 48
  min_fraction = 0.3

  [[step.expect]]
  at = "+0ms..+300ms"
  check = "pixel"
  region = [-10, 0, 8, 0]
  color = "#ff9a0a"
  tolerance = 48
  min_fraction = 0.3

# It reads as live: the stripes march; and with no --tint, the desktop itself is left alone.
[[step]]
id = "alive"
do = { wait_ms = 1300 }

  [[step.expect]]                  # stripes moved along the top edge
  at = "+400ms..+1200ms"
  check = "changed"
  region = [200, 2, 400, 8]
  min_px = 200

  [[step.expect]]                  # no tint by default: an empty stretch of desktop stays put
  at = "+600ms..+1250ms"
  check = "changed"
  region = [100, 250, 300, 150]
  min_px = 2000
  fuzz = 1
  not = true

# Park the pointer: the arrow wears the robot badge, right there, with no lag to chase.
[[step]]
id = "robot-cursor"
do = { hyprhands = { op = "move", x = 400, y = 300 } }
settle_ms = 500

  [[step.expect]]                  # the badge, at the arrow's lower right
  at = "+50ms..+300ms"
  anchor = "ack"
  check = "pixel"
  region = [410, 310, 14, 14]
  color = "#94a6aa"
  tolerance = 32
  min_fraction = 0.15

  [[step.expect]]                  # caption for the move
  at = "+100ms..+1500ms"
  anchor = "ack"
  check = "ocr"
  region = [0, -100, 0, 100]
  text = "move to 400, 300"

# Jump and click: a trail from where the pointer was, then a ring at the click.
[[step]]
id = "click"
do = { hyprhands = { op = "click", x = 800, y = 500 } }
settle_ms = 1200

  [[step.expect]]                  # trail: the middle of the jump from (400, 300) to (800, 500); it is
  at = "+0ms..+350ms"              # 55% opaque, so its colour depends on what is under it: check change
  check = "changed"
  region = [590, 390, 20, 20]
  min_px = 20

  [[step.expect]]                  # ring around the click
  at = "+0ms..+250ms"
  anchor = "ack"
  check = "pixel"
  region = [768, 468, 64, 64]
  color = "#ff9a0a"
  tolerance = 60
  min_fraction = 0.03

  [[step.expect]]                  # ring gone again
  at = "+650ms..+900ms"
  anchor = "ack"
  check = "pixel"
  region = [768, 468, 64, 64]
  color = "#ff9a0a"
  tolerance = 60
  min_fraction = 0.03
  not = true

  [[step.expect]]
  at = "+100ms..+1500ms"
  anchor = "ack"
  check = "ocr"
  region = [0, -100, 0, 100]
  text = "click 800, 500"

# A client's own words replace the generated caption.
[[step]]
id = "client-caption"
do = { hyprhands = { op = "move", x = 420, y = 320, caption = "qa: open the settings menu" } }
settle_ms = 800

  [[step.expect]]
  at = "+100ms..+1500ms"
  anchor = "ack"
  check = "ocr"
  region = [0, -100, 0, 100]
  text = "open the settings menu"

# A capture hides the overlay for about a frame: measure whether that shows on screen at all,
# and that everything comes back.
[[step]]
id = "capture-blink"
do = { hyprhands = { op = "screenshot" } }
settle_ms = 600

  [[step.expect]]                  # informational: at least one recorded frame without the band
  at = "+0ms..+200ms"
  check = "pixel"
  region = [0, 2, 0, 8]
  color = "#ff9a0a"
  tolerance = 48
  min_fraction = 0.3
  not = true
  mode = "any"

  [[step.expect]]                  # and it is back
  at = "+300ms..+500ms"
  anchor = "ack"
  check = "pixel"
  region = [0, 2, 0, 8]
  color = "#ff9a0a"
  tolerance = 48
  min_fraction = 0.3

# The panic file stops it: the frame turns red and the caption says why.
[[step]]
id = "stopped"
do = { session = "hyprhands stop" }
settle_ms = 1200

  [[step.expect]]
  at = "+250ms..+1000ms"
  anchor = "ack"
  check = "pixel"
  region = [0, 2, 0, 8]
  color = "#ff3b4a"
  tolerance = 48
  min_fraction = 0.3

  [[step.expect]]
  at = "+250ms..+1100ms"
  anchor = "ack"
  check = "ocr"
  region = [0, -100, 0, 100]
  text = "stopped"

# The session is killed: the overlay goes with the process and the owner's cursor comes back
# (the signal path of the cursor restore).
[[step]]
id = "killed"
do = { session = "pkill -TERM -x hyprhands; sleep 0.3" }
settle_ms = 2200

  [[step.expect]]
  at = "+300ms..+700ms"
  anchor = "ack"
  check = "pixel"
  region = [0, 2, 0, 8]
  color = "#ff3b4a"
  tolerance = 48
  min_fraction = 0.3
  not = true

  [[step.expect]]                  # the badge is gone from the pointer (still parked at 420, 320);
  at = "+1400ms..+1900ms"          # the restore hides and shows the cursor, ~1.2 s
  anchor = "ack"
  check = "pixel"
  region = [430, 330, 14, 14]
  color = "#94a6aa"
  tolerance = 32
  min_fraction = 0.15
  not = true
