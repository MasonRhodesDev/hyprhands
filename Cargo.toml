[package]
name = "hyprhands"
version = "0.1.0"
edition = "2024"
description = "Fast, safe hands on a Hyprland desktop for agent loops"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
qoi = "0.4.1"
rustix = { version = "1.1.5", features = ["fs", "shm", "mm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = "fat"
codegen-units = 1
# No panic = "abort": unwinding runs Drop, which is what releases a held pointer button.
