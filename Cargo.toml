[package]
name = "hyprhands"
version = "0.1.0"
edition = "2024"
description = "Fast, safe hands on a Hyprland desktop for agent loops"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-io = "2"
atspi = { version = "0.30", default-features = false, features = ["proxies", "connection", "wrappers"] }
fontdue = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "async-await", "async-await-macro", "std"] }
qoi = "0.4.1"
rustix = { version = "1.1.5", features = ["fs", "shm", "mm", "event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[profile.release]
lto = "fat"
codegen-units = 1
# No panic = "abort": unwinding runs Drop, which is what releases a held pointer button.
