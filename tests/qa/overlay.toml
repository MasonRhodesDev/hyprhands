# What the owner sees while hyprhands drives, in the default theme (8-bit construction site): the
# hazard-tape frame, the robot cursor (on the arrow and on an app's own I-beam), the movement
# tail, the click ripple, captions in the pixel font, the capture blink, the stopped state, and
# the cleanup when the session dies.
#
# Run with hypr-qa (https://github.com/MasonRhodesDev/hypr-qa) on the KVM host, from a hyprhands
# checkout built in release:  hypr-qa run tests/qa/overlay.toml
#
# The construction theme's colours are fixed (src/theme.rs): tape #ffc400 / #141414, stopped
# #e5202a / #f4f4f4, ripple #b6ff00, tail #ff6a13. It draws 3 px pixels, so fades are dithered
# and exact shapes are blocky: checks use colours with generous regions. The frame is 12 px; the
# ripple lasts ~1 s; the tail draws over 220 ms and fades over 420 ms; no tint by default.
# The guest is plain-hyprland: Virtual-1, 1280x800, scale 1, Adwaita cursors at 24, foot.

name     = "hyprhands-overlay"
profile  = "plain-hyprland"
snapshot = "session-ready"

[[setup]]
push = { src = "../../target/release/hyprhands", dst = "/usr/local/bin/hyprhands", mode = "0755" }

[[setup]]
session = "hyprhands --help >/dev/null 2>&1; hyprhands doctor"

[hyprhands]
argv = ["hyprhands", "serve", "--monitor", "Virtual-1"]

# The session is up: hazard tape on all four edges.
[[step]]
id = "frame-up"
do = { wait_ms = 400 }

  [[step.expect]]
  at = "+0ms..+300ms"
  check = "pixel"
  region = [0, 0, 0, 12]
  color = "#ffc400"
  tolerance = 40
  min_fraction = 0.3

  [[step.expect]]
  at = "+0ms..+300ms"
  check = "pixel"
  region = [0, -12, 0, 12]
  color = "#ffc400"
  tolerance = 40
  min_fraction = 0.3

  [[step.expect]]
  at = "+0ms..+300ms"
  check = "pixel"
  region = [0, 0, 12, 0]
  color = "#ffc400"
  tolerance = 40
  min_fraction = 0.3

  [[step.expect]]
  at = "+0ms..+300ms"
  check = "pixel"
  region = [-12, 0, 12, 0]
  color = "#ffc400"
  tolerance = 40
  min_fraction = 0.3

# It reads as live: the tape marches; and with no --tint, the desktop itself is left alone.
[[step]]
id = "alive"
do = { wait_ms = 1300 }

  [[step.expect]]
  at = "+400ms..+1200ms"
  check = "changed"
  region = [200, 0, 400, 12]
  min_px = 200

  [[step.expect]]
  at = "+600ms..+1250ms"
  check = "changed"
  region = [100, 250, 300, 150]
  min_px = 2000
  fuzz = 1
  not = true

# Park the pointer on empty desktop: the arrow wears the robot badge.
[[step]]
id = "robot-cursor"
do = { hyprhands = { op = "move", x = 400, y = 300 } }
settle_ms = 500

  [[step.expect]]                  # the badge, somewhere at the arrow's lower right
  at = "+50ms..+300ms"
  anchor = "ack"
  check = "pixel"
  region = [398, 298, 34, 34]
  color = "#94a6aa"
  tolerance = 32
  min_fraction = 0.04

  [[step.expect]]                  # caption for the move, in the pixel font
  at = "+100ms..+1500ms"
  anchor = "ack"
  check = "ocr"
  region = [0, -110, 0, 110]
  text = "move to 400, 300"

# Jump and click: the tail draws out from where the pointer was and fades from its end; the
# ripple spreads at the click; each in its own colour.
[[step]]
id = "click"
do = { hyprhands = { op = "click", x = 800, y = 500 } }
settle_ms = 1500

  [[step.expect]]                  # tail, around the middle of the jump (400,300) -> (800,500)
  at = "+60ms..+320ms"
  check = "pixel"
  region = [575, 375, 50, 50]
  color = "#ff6a13"
  tolerance = 50
  min_fraction = 0.02

  [[step.expect]]                  # tail gone
  at = "+800ms..+1100ms"
  check = "pixel"
  region = [575, 375, 50, 50]
  color = "#ff6a13"
  tolerance = 50
  min_fraction = 0.02
  not = true

  [[step.expect]]                  # ripple around the click
  at = "+0ms..+400ms"
  anchor = "ack"
  check = "pixel"
  region = [732, 432, 136, 136]
  color = "#b6ff00"
  tolerance = 60
  min_fraction = 0.01

  [[step.expect]]                  # ripple gone after ~1 s
  at = "+1150ms..+1400ms"
  anchor = "ack"
  check = "pixel"
  region = [732, 432, 136, 136]
  color = "#b6ff00"
  tolerance = 60
  min_fraction = 0.01
  not = true

  [[step.expect]]
  at = "+100ms..+1500ms"
  anchor = "ack"
  check = "ocr"
  region = [0, -110, 0, 110]
  text = "click 800, 500"

# An app's own pointer shape: over foot's text the pointer is the I-beam, and it wears the
# badge too (every shape of the owner's theme is badged, not only the arrow).
[[step]]
id = "app-cursor"
do = { hyprhands = { op = "launch", argv = ["foot"] } }
settle_ms = 800

[[step]]
id = "i-beam"
do = { hyprhands = { op = "move", x = 640, y = 420, caption = "qa: over foot's text" } }
settle_ms = 600

  [[step.expect]]
  at = "+100ms..+500ms"
  anchor = "ack"
  check = "pixel"
  region = [624, 404, 40, 40]
  color = "#94a6aa"
  tolerance = 32
  min_fraction = 0.03

  [[step.expect]]                  # a client's own words replace the generated caption
  at = "+100ms..+1500ms"
  anchor = "ack"
  check = "ocr"
  region = [0, -110, 0, 110]
  text = "over foot"

# A capture hides the overlay for about a frame: measure whether that shows on screen at all,
# and that everything comes back.
[[step]]
id = "capture-blink"
do = { hyprhands = { op = "screenshot" } }
settle_ms = 600

  [[step.expect]]                  # informational: at least one recorded frame without the tape
  at = "+0ms..+200ms"
  check = "pixel"
  region = [0, 0, 0, 12]
  color = "#ffc400"
  tolerance = 40
  min_fraction = 0.3
  not = true
  mode = "any"

  [[step.expect]]                  # and it is back
  at = "+300ms..+500ms"
  anchor = "ack"
  check = "pixel"
  region = [0, 0, 0, 12]
  color = "#ffc400"
  tolerance = 40
  min_fraction = 0.3

# The panic file stops it: the tape turns to red-and-white barrier tape and the caption says why.
[[step]]
id = "stopped"
do = { session = "hyprhands stop" }
settle_ms = 1200

  [[step.expect]]
  at = "+250ms..+1000ms"
  anchor = "ack"
  check = "pixel"
  region = [0, 0, 0, 12]
  color = "#e5202a"
  tolerance = 40
  min_fraction = 0.3

  [[step.expect]]
  at = "+250ms..+1100ms"
  anchor = "ack"
  check = "ocr"
  region = [0, -110, 0, 110]
  text = "stopped"

# The session is killed: the overlay goes with the process and the owner's cursor comes back
# (the signal path of the cursor restore).
[[step]]
id = "killed"
do = { session = "pkill -TERM -x hyprhands; sleep 0.3" }
settle_ms = 2200

  [[step.expect]]
  at = "+300ms..+700ms"
  anchor = "ack"
  check = "pixel"
  region = [0, 0, 0, 12]
  color = "#e5202a"
  tolerance = 40
  min_fraction = 0.3
  not = true

  [[step.expect]]                  # the badge is gone from the pointer (still over foot's text);
  at = "+1400ms..+1900ms"          # the restore hides and shows the cursor, ~1.2 s
  anchor = "ack"
  check = "pixel"
  region = [624, 404, 40, 40]
  color = "#94a6aa"
  tolerance = 32
  min_fraction = 0.03
  not = true
